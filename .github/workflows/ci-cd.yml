name: CI/CD (deprecated - replaced by build.yml + deploy.yml)

on:
  workflow_dispatch:


jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build backend WAR/JAR
        working-directory: backend
        run: |
          mvn -B -q clean package

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            backend/target/*.jar
            backend/target/*.war

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (latest 20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install & build frontend

        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/dist
            frontend/dist/**

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./deploy/frontend

      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: ./deploy/backend

      # === Option A (recommended): SSH/SCP deploy ===
      # Configure these repo secrets:
      #   SSH_HOST, SSH_USER, SSH_KEY (private key), REMOTE_BACKEND_DIR, REMOTE_FRONTEND_DIR
      # If you use a different strategy (Docker, systemd, etc.), update this job accordingly.

      - name: Deploy to nodes (SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_BACKEND_DIR: ${{ secrets.REMOTE_BACKEND_DIR }}
          REMOTE_FRONTEND_DIR: ${{ secrets.REMOTE_FRONTEND_DIR }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Deploy backend artifact
          BACKEND_JAR=$(ls ./deploy/backend/*.jar 2>/dev/null | head -n 1 || true)
          BACKEND_WAR=$(ls ./deploy/backend/*.war 2>/dev/null | head -n 1 || true)
          if [ -n "$BACKEND_WAR" ]; then
            scp -o StrictHostKeyChecking=no "$BACKEND_WAR" "$SSH_USER@$SSH_HOST:$REMOTE_BACKEND_DIR/"
          else
            scp -o StrictHostKeyChecking=no "$BACKEND_JAR" "$SSH_USER@$SSH_HOST:$REMOTE_BACKEND_DIR/"
          fi

          # Deploy frontend dist
          scp -o StrictHostKeyChecking=no -r ./deploy/frontend/* "$SSH_USER@$SSH_HOST:$REMOTE_FRONTEND_DIR/"

      # Optional: restart backend service on remote host
      # This requires additional secrets/config and service knowledge.
      # - name: Restart backend
      #   env:
      #     SSH_HOST: ${{ secrets.SSH_HOST }}
      #     SSH_USER: ${{ secrets.SSH_USER }}
      #     SSH_KEY: ${{ secrets.SSH_KEY }}
      #   run: |
      #     echo "Restart backend service manually on the server (edit workflow)."
